version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci --legacy-peer-deps || npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/scorito-planner
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .angular/cache/**/*
