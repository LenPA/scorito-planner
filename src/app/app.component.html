<header class="app-navbar border-bottom bg-white shadow-sm sticky-top">
  <div class="container-fluid px-3 px-md-4 py-2 d-flex justify-content-between align-items-center">
    <a routerLink="/" class="brand-link d-flex align-items-center text-decoration-none">
      <div class="brand-icon-wrapper me-2">
        <i class="fas fa-bicycle brand-icon"></i>
      </div>
      <div>
        <div class="brand-name">SCORITO<span class="brand-highlight">PLANNER</span></div>
        <div class="brand-sub">Wieler Seizoen 2026 / 2027</div>
      </div>
    </a>

    <nav class="d-flex align-items-center gap-2">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        class="nav-pill-btn">
        <i class="fas fa-th-large me-1"></i>
        <span>Home</span>
      </a>

      <div class="nav-divider d-none d-sm-block"></div>

      <div class="nav-subgroup d-flex align-items-center gap-1">
        <a routerLink="/planner" routerLinkActive="active" class="nav-pill-btn">
          <i class="fas fa-calendar-alt me-1"></i>
          <span>Race Planner</span>
        </a>
        <a routerLink="/overview" routerLinkActive="active" class="nav-pill-btn">
          <i class="fas fa-users me-1"></i>
          <span>Squad Overview</span>
        </a>
        <a routerLink="/riders" routerLinkActive="active" class="nav-pill-btn">
          <i class="fas fa-sync me-1"></i>
          <span>Data Sync</span>
        </a>
      </div>
    </nav>
  </div>
</header>

<main class="app-main-content">
  <router-outlet></router-outlet>
</main>
